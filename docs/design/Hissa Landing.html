  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

5 'Bricolage Grotesque';margin-top:8px\">Put your plate in the frame<\u002Fdiv><p style=\"margin:8px 0 0;font:400 16px/1.55 Figtree;color:#B9BCC1\">Karahi, biryani, nihari, whatever is on the table. No weighing, no typing.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div data-fl=\"r\" style=\"border-radius:28px;background:#161718;border:1px solid #303236;overflow:hidden\"><div style=\"height:230px;background:#202224;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 26px\"><div style=\"display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:#26301A;border:1px solid #D4FF3A;font:600 15px Figtree\"><span style=\"color:#D4FF3A\">✓<\u002Fspan>Chicken karahi<span style=\"margin-left:auto;font-weight:400;color:#A3A6AB\">1 katori<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:#161718;border:1px solid #303236;font:600 15px Figtree\"><span style=\"width:12px\"><\u002Fspan>Roti<span style=\"margin-left:auto;font-weight:400;color:#A3A6AB\">x2<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:#2B2A10;border:1.5px dashed #F2D27A;font:600 15px Figtree;color:#F2D27A\">?<span>Daal or haleem?<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"padding:24px 26px 30px\"><div style=\"font:600 14px Figtree;color:#D4FF3A\">02 Confirm<\u002Fdiv><div style=\"font:700 25px/1.15 'Bricolage Grotesque';margin-top:8px\">Tap what's right, fix what's off<\u002Fdiv><p style=\"margin:8px 0 0;font:400 16px/1.55 Figtree;color:#B9BCC1\">Hissa asks when it isn't sure. It never pretends to be.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div data-fl=\"l\" style=\"border-radius:28px;background:#161718;border:1px solid #303236;overflow:hidden\"><div style=\"height:230px;background:#202224;display:flex;align-items:center;justify-content:center\"><svg width=\"170\" height=\"170\" sc-camel-view-box=\"0 0 220 220\"><circle cx=\"110\" cy=\"110\" r=\"104\" fill=\"#2A2C2F\" stroke=\"#4A4D52\" stroke-width=\"3\"><\u002Fcircle><path d=\"M110 110 L110 14 A96 96 0 0 1 193 158 Z\" fill=\"rgba(212,255,58,.25)\" stroke=\"#D4FF3A\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M110 110 L193 158 A96 96 0 0 1 27 158 Z\" fill=\"none\" stroke=\"#6A6D73\" stroke-width=\"3\"><\u002Fpath><path d=\"M110 110 L27 158 A96 96 0 0 1 110 14 Z\" fill=\"none\" stroke=\"#6A6D73\" stroke-width=\"3\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"padding:24px 26px 30px\"><div style=\"font:600 14px Figtree;color:#D4FF3A\">03 Eat<\u002Fdiv><div style=\"font:700 25px/1.15 'Bricolage Grotesque';margin-top:8px\">Get your hissa for the plate<\u002Fdiv><p style=\"margin:8px 0 0;font:400 16px/1.55 Figtree;color:#B9BCC1\">One katori, one and a half roti. Big day? You get a lighter plate, kindly.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<!-- FEATURES -->\n<section id=\"features\" data-sec=\"\" data-side=\"-1\" style=\"max-width:1120px;margin:0 auto;padding:clamp(72px,10vw,120px) clamp(16px,4vw,40px)\">\n<div style=\"font:600 14px Figtree;letter-spacing:.14em;text-transform:uppercase;color:#D4FF3A\">Inside the app<\u002Fdiv>\n<h2 data-r=\"\" style=\"margin:16px 0 0;font:800 clamp(40px,7vw,92px)/.95 'Bricolage Grotesque';letter-spacing:-.04em;text-transform:uppercase\">Quiet by design<\u002Fh2>\n<div style=\"margin-top:clamp(36px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px\">\n<div data-fl=\"l\" style=\"padding:30px;border-radius:28px;background:#202224;border:1px solid #303236;display:flex;flex-direction:column;gap:18px\"><div style=\"font:700 26px/1.15 'Bricolage Grotesque'\">A budget you don't have to read<\u002Fdiv><p style=\"margin:0;font:400 16px/1.55 Figtree;color:#B9BCC1\">Calories stay in the background, always marked as an estimate. You see what's left today.<\u002Fp><div style=\"margin-top:auto;display:flex;justify-content:center;padding-top:8px\"><div style=\"position:relative;width:180px;height:180px\"><svg width=\"180\" height=\"180\" sc-camel-view-box=\"0 0 220 220\" style=\"transform:rotate(-90deg)\"><circle cx=\"110\" cy=\"110\" r=\"100\" fill=\"none\" stroke=\"#34373B\" stroke-width=\"10\"><\u002Fcircle><circle cx=\"110\" cy=\"110\" r=\"100\" fill=\"none\" stroke=\"#D4FF3A\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-dasharray=\"628\" stroke-dashoffset=\"323\" style=\"animation:hring 2s .3s ease-out both\"><\u002Fcircle><\u002Fsvg><div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center\"><div style=\"font:700 44px/1 'Bricolage Grotesque'\">950<\u002Fdiv><div style=\"font:500 14px Figtree;color:#B9BCC1\">kcal left<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div data-fl=\"r\" style=\"padding:30px;border-radius:28px;background:#202224;border:1px solid #303236;display:flex;flex-direction:column;gap:18px\"><div style=\"font:700 26px/1.15 'Bricolage Grotesque'\">A week, not a day<\u002Fdiv><p style=\"margin:0;font:400 16px/1.55 Figtree;color:#B9BCC1\">Lunch is your big meal and it fits. Hissa reads the pattern and says so in plain words.<\u002Fp><div style=\"margin-top:auto;position:relative;height:150px;display:flex;align-items:flex-end;gap:10px\"><div style=\"position:absolute;left:0;right:0;top:6px;border-top:1.5px dashed #6A6D73\"><\u002Fdiv><sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"7\"><div style=\"flex:1;height:{{ b.h }}px;border-radius:8px;background:{{ b.bg }};border:{{ b.bd }};box-sizing:border-box\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div data-fl=\"l\" style=\"padding:30px;border-radius:28px;background:#202224;border:1px solid #303236;display:flex;flex-direction:column;gap:18px\"><div style=\"font:700 26px/1.15 'Bricolage Grotesque'\">Knows your dishes<\u002Fdiv><p style=\"margin:0;font:400 16px/1.55 Figtree;color:#B9BCC1\">Counts in katori and roti, and asks when it is unsure between two lookalikes.<\u002Fp><div style=\"margin-top:auto;display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ dishes }}\" as=\"d\" hint-placeholder-count=\"8\"><span style=\"height:40px;padding:0 16px;border-radius:99px;border:1px solid #44474C;display:inline-flex;align-items:center;font:500 15px Figtree\">{{ d }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div data-fl=\"r\" style=\"padding:30px;border-radius:28px;background:#D4FF3A;color:#141414;display:flex;flex-direction:column;gap:18px\"><div style=\"font:700 26px/1.15 'Bricolage Grotesque'\">How did lunch sit?<\u002Fdiv><p style=\"margin:0;font:400 16px/1.55 Figtree\">A two-tap check-in on energy and stomach. Over time it learns what works for you.<\u002Fp><div style=\"margin-top:auto;display:flex;gap:8px\"><div style=\"flex:1;height:80px;border-radius:14px;border:1.5px solid #141414;display:flex;align-items:center;justify-content:center;font:600 15px Figtree\">Low<\u002Fdiv><div style=\"flex:1;height:80px;border-radius:14px;border:1.5px solid #141414;display:flex;align-items:center;justify-content:center;font:600 15px Figtree\">Okay<\u002Fdiv><div style=\"flex:1;height:80px;border-radius:14px;background:#141414;color:#D4FF3A;display:flex;align-items:center;justify-content:center;font:600 15px Figtree\">Good<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- BUDDY -->\n<section id=\"buddy\" data-sec=\"\" data-side=\"1\" style=\"background:rgba(32,34,36,.7);border-block:1px solid #2C2E31;overflow:hidden\"><div style=\"max-width:1120px;margin:0 auto;padding:clamp(72px,10vw,120px) clamp(16px,4vw,40px) clamp(48px,6vw,80px)\">\n<div style=\"font:600 14px Figtree;letter-spacing:.14em;text-transform:uppercase;color:#D4FF3A\">Buddy<\u002Fdiv>\n<h2 data-r=\"\" style=\"margin:16px 0 0;max-width:10em;font:800 clamp(40px,7vw,92px)/.95 'Bricolage Grotesque';letter-spacing:-.04em;text-transform:uppercase\">Log together. Keep one streak.<\u002Fh2>\n<p style=\"margin:24px 0 0;max-width:30em;font:400 18px/1.55 Figtree;color:#B9BCC1;text-wrap:pretty\">Pair with a friend, a sibling, a spouse. You only see that they logged, never what they ate. A nudge when they forget, no judgement when they do.<\u002Fp>\n<div data-a=\"buddy\" style=\"position:relative;height:clamp(360px,46vw,470px);margin-top:24px;display:flex;flex-direction:column;align-items:center\">\n<div style=\"font:800 clamp(190px,34vw,380px)/.82 'Bricolage Grotesque';letter-spacing:-.06em;color:#D4FF3A;margin-top:4px\">12<\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px\"><div style=\"font:500 16px Figtree;color:#F2F3EE\">days together<\u002Fdiv><div style=\"display:flex;gap:10px\"><sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"7\"><div style=\"width:22px;height:22px;border-radius:99px;background:{{ d.bg }};border:{{ d.bd }};box-sizing:border-box\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<a href=\"#join\" data-ink=\"\" data-ink-text=\"#141414\" data-ink-base=\"#D4FF3A\" style=\"position:relative;overflow:hidden;isolation:isolate;margin-top:24px;height:56px;padding:0 28px;border-radius:99px;border:1px solid #D4FF3A;color:#D4FF3A;font:600 16px Figtree;display:inline-flex;align-items:center;text-decoration:none;box-sizing:border-box\"><span data-fill=\"\" style=\"position:absolute;left:0;top:0;width:10px;height:10px;border-radius:99px;background:#D4FF3A;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:-1\"><\u002Fspan><span>Bring your buddy<\u002Fspan><\u002Fa>\n<\u002Fdiv><\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" data-sec=\"\" data-side=\"-1\" style=\"max-width:1120px;margin:0 auto;padding:clamp(72px,10vw,120px) clamp(16px,4vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,6vw,72px)\">\n<h2 data-r=\"\" style=\"margin:0;font:800 clamp(40px,6vw,76px)/.95 'Bric d(torso, Bx(0.62, 0.72, 0.22), dark, 0, 0.7, -0.44); add(torso, Cy(0.12, 0.22), dark, 0, 1.3, 0);\n    const head = new T.Group(); head.position.y = 1.72; torso.add(head);\n    add(head, Bx(0.84, 0.62, 0.68), body); add(head, Bx(0.66, 0.26, 0.06), glass, 0, 0.02, 0.35);\n    add(head, Bx(0.13, 0.09, 0.03), lime, -0.16, 0.02, 0.385); add(head, Bx(0.13, 0.09, 0.03), lime, 0.16, 0.02, 0.385);\n    [-1, 1].forEach(s => { const e = add(head, Cy(0.1, 0.14), lime, s * 0.47, 0, 0); e.rotation.z = Math.PI / 2; });\n    add(head, Cy(0.025, 0.4), dark, 0, 0.5, 0); add(head, Sp(0.07), lime, 0, 0.72, 0);\n    const sh = [], el = [], hip = [], fist = [];\n    [-1, 1].forEach((s, i) => {\n      const g = new T.Group(); g.position.set(s * 0.68, 1.05, 0); torso.add(g); add(g, Sp(0.22), body);\n      add(g, Cy(0.12, 0.55), dark, 0, -0.3, 0);\n      const e = new T.Group(); e.position.y = -0.6; g.add(e); add(e, Sp(0.13), dark); add(e, Cy(0.14, 0.5), body, 0, -0.27, 0); fist.push(add(e, Sp(0.19), lime, 0, -0.62, 0));\n      sh.push(g); el.push(e);\n      const h = new T.Group(); h.position.set(s * 0.28, 0.95, 0); rig.add(h); add(h, Cy(0.15, 0.8), dark, 0, -0.4, 0); add(h, Sp(0.16), body, 0, -0.02, 0); add(h, Bx(0.34, 0.14, 0.55), body, 0, -0.85, 0.1); hip.push(h);\n    });\n    return { root, rig, torso, sh, el, hip, fist, c: { sh0: 0, sh1: 0, el0: -0.2, el1: -0.2, h0: 0, h1: 0, lean: 0, yaw: 0, tw: 0, bob: 0 } };\n  }\n  boot3D() {\n    const T = window.THREE;\n    if (!T) { this.tries = (this.tries || 0) + 1; if (this.tries > 60) return; setTimeout(() => this.boot3D(), 100); return; }\n    const cv = document.createElement('canvas'); cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:15'; document.body.appendChild(cv); this.cv = cv;\n    let R; try { R = new T.WebGLRenderer({ canvas: cv, alpha: true, antialias: true, preserveDrawingBuffer: true }); } catch (e) { cv.remove(); this.setState({ words: 3, intro: true }); return; }\n    R.set 5), L(-0.1, -2, (tp - 0.5) / 0.45)]; };\n    const strikes = [1.5, 2.25, 3.0], fired = [false, false, false];\n    let T0 = 0, last = 0, lastSy = scrollY, vel = 0, shake = 0, landedAt = 0, shook = false, introEnd = false;\n    const v3 = new T.Vector3();\n    const tick = now => {\n      if (this.dead) return; requestAnimationFrame(tick);\n      const t = now / 1000, dt = Math.min(0.05, t - last || 0.016); last = t;\n      if (!T0) { T0 = t; this.setState({ ready: true }); }\n      const ti = this.reduce ? 99 : t - T0;\n      const sy = scrollY, docH = document.documentElement.scrollHeight, maxS = Math.max(1, docH - vh);\n      vel = lerp(vel, (sy - lastSy) / Math.max(dt, 0.001), 0.15); lastSy = sy;\n      const mobile = vw < 780, gutter = Math.max(0, (vw - 1120) / 2);\n      const secs = [...document.querySelectorAll('[data-sec]')].map(e => { const r = e.getBoundingClientRect(); return { y: r.top + sy + r.height / 2, s: +e.dataset.side }; });\n      const cy = sy + vh / 2; let side = 1;\n      if (secs.length) { let i = 0; while (i < secs.length - 1 && cy >= secs[i + 1].y) i++; const a = secs[i], b = secs[Math.min(i + 1, secs.length - 1)]; side = b === a ? a.s : lerp(a.s, b.s, sm((cy - a.y) / (b.y - a.y))); }\n      const jsz = mobile ? 92 : Math.max(120, Math.min(240, gutter * 1.5)), gx = mobile ? 46 : Math.max(60, gutter / 2);\n      let X = lerp(vw - gx, gx, (1 - side) / 2), Y = vh - (mobile ? 16 : vh * 0.18) + Math.sin(sy / 160) * 12, S = jsz;\n      let yawT = -side * 0.55, mode = Math.abs(vel) > 70 ? 'run' : 'idle';\n      const he = q('[data-a=\"hero\"]'); let hw = 0;\n      if (he) { const r = he.getBoundingClientRect(); hw = 1 - sm(sy / (vh * 0.45)); const hs = Math.min(380, r.height * 0.8); X = lerp(X, r.left + r.width / 2, hw); Y = lerp(Y, r.bottom - r.height * 0.1, hw); S = lerp(S, hs, hw); }\n      const inIntro = hw > 0.5 && ti < 4.2 && !this.reduce;\n      if (hw > 0.5) { yawT = -0.9; mode = inIntro ? 'punch' : 'idle'; }\n      const bu = q('[data-a=
