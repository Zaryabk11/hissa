services:
  - type: web
    name: hissa-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w backend
    startCommand: npm start -w backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SNAPS_ENABLED
        value: "true"
