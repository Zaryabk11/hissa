name: Check session logs
on:
  pull_request:
    paths: ['.claude-logs/**']
  push:
    branches: [main]
    paths: ['.claude-logs/**']
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log files must be <YYYY-MM-DD_HH-MM-SS>_<session-id>.md
        run: |
          bad=$(ls .claude-logs | grep -vE '^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}_[0-9a-zA-Z-]{20,}\.md$' || true)
          if [ -n "$bad" ]; then echo "Misnamed logs (8x will not detect them):"; echo "$bad"; exit 1; fi
